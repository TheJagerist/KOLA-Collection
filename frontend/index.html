<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3d2e1f" />
    <meta name="description" content="Kōlā Collection — commandez l'uniforme scolaire réglementaire du Congo en ligne. Livraison à Brazzaville et Pointe-Noire, paiement Mobile Money." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Applique le thème avant le premier rendu (évite le flash blanc)
      try {
        var t = JSON.parse(localStorage.getItem('kola.theme') || '{}').state?.pref || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <title>Kōlā Collection — Uniformes scolaires au Congo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
